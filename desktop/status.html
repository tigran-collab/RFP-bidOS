<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFP BidOS</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #172033;
    }
    main {
      width: min(640px, calc(100vw - 48px));
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(20, 32, 50, 0.10);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }
    p {
      margin: 8px 0 18px;
      line-height: 1.45;
    }
    ol {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }
    li {
      display: grid;
      grid-template-columns: 14px 1fr;
      gap: 10px;
      align-items: start;
      color: #647084;
    }
    strong {
      display: block;
      font-size: 14px;
      font-weight: 650;
      color: inherit;
    }
    small {
      display: block;
      margin-top: 2px;
      color: #647084;
      overflow-wrap: anywhere;
    }
    .dot {
      width: 10px;
      height: 10px;
      margin-top: 4px;
      border-radius: 50%;
      background: #c9d2df;
    }
    .running {
      color: #234f9b;
    }
    .running .dot {
      background: #2f6fed;
    }
    .done {
      color: #1f6d44;
    }
    .done .dot {
      background: #2f9e5f;
    }
    .failed,
    .error {
      color: #a33b32;
    }
    .failed .dot,
    .error .dot {
      background: #d34b3f;
    }
    pre {
      display: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 12px;
      border-radius: 6px;
      background: #eef2f7;
      color: #202a3a;
      max-height: 240px;
      overflow: auto;
    }
    pre.visible {
      display: block;
      margin: 18px 0 0;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">RFP BidOS</h1>
    <p id="message">Preparing local services...</p>
    <ol id="steps"></ol>
    <pre id="detail"></pre>
  </main>
  <script>
    const defaultSteps = [
      "Checking Ollama",
      "Starting Ollama if needed",
      "Checking qwen3:8b model",
      "Starting backend",
      "Starting frontend",
      "Opening RFP BidOS",
    ].map((label) => ({ label, status: "pending", detail: "" }));

    const state = {
      title: "RFP BidOS",
      message: "Preparing local services...",
      steps: defaultSteps,
      detail: "",
    };

    function render(payload = {}) {
      if (payload.title) state.title = payload.title;
      if (payload.message) state.message = payload.message;
      if (Array.isArray(payload.steps)) {
        state.steps = payload.steps;
      } else if (payload.step) {
        state.steps = state.steps.map((step) => (
          step.label === payload.step
            ? { ...step, status: payload.status || step.status, detail: payload.message || step.detail }
            : step
        ));
      }
      state.detail = payload.detail || payload.error || "";

      document.getElementById("title").textContent = state.title;
      document.getElementById("message").textContent = state.message;

      const steps = document.getElementById("steps");
      steps.replaceChildren(...state.steps.map((step) => {
        const item = document.createElement("li");
        item.className = step.status || "pending";

        const dot = document.createElement("span");
        dot.className = "dot";

        const body = document.createElement("div");
        const label = document.createElement("strong");
        label.textContent = step.label;
        body.appendChild(label);

        if (step.detail) {
          const detail = document.createElement("small");
          detail.textContent = step.detail;
          body.appendChild(detail);
        }

        item.appendChild(dot);
        item.appendChild(body);
        return item;
      }));

      const detail = document.getElementById("detail");
      detail.textContent = state.detail;
      detail.className = state.detail ? "visible" : "";
    }

    render();
    window.rfpBidos?.onStartupStatus(render);
  </script>
</body>
</html>
